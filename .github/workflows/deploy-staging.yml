name: Deploy Staging

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: staging-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Staging
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: staging

    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify tested commit SHA
        env:
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid workflow_run head SHA." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Configure SSH
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          test -n "$STAGING_SSH_KEY"
          test -n "$STAGING_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$STAGING_SSH_KEY" > "$HOME/.ssh/staging_deploy_key"
          chmod 600 "$HOME/.ssh/staging_deploy_key"
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy tested commit to staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          test -n "$STAGING_HOST"
          test -n "$STAGING_USER"

          remote_host="${STAGING_USER}@${STAGING_HOST}"
          remote_state_dir="/home/deploy/dastorkon-deploy-state"
          remote_script="${remote_state_dir}/github-actions-deploy-${TARGET_SHA}.sh"
          remote_script_tmp="${remote_script}.tmp"
          ssh_options=(
            -i "$HOME/.ssh/staging_deploy_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          )

          cleanup_remote_script() {
            local cleanup_status

            set +e
            ssh "${ssh_options[@]}" "$remote_host" \
              "rm -f '$remote_script' '$remote_script_tmp'" < /dev/null
            cleanup_status=$?
            set -e

            if ((cleanup_status != 0)); then
              echo "Warning: failed to remove the uploaded deployment script." >&2
            fi
          }

          set +e
          ssh "${ssh_options[@]}" "$remote_host" \
            "install -d -m 700 '$remote_state_dir' &&
             umask 077 &&
             cat > '$remote_script_tmp' &&
             chmod 700 '$remote_script_tmp' &&
             mv '$remote_script_tmp' '$remote_script'" \
            < scripts/deploy_staging.sh
          upload_status=$?
          set -e

          if ((upload_status != 0)); then
            cleanup_remote_script
            exit "$upload_status"
          fi

          set +e
          ssh "${ssh_options[@]}" "$remote_host" \
            "bash '$remote_script' '$TARGET_SHA'" < /dev/null
          deploy_status=$?
          set -e

          cleanup_remote_script
          exit "$deploy_status"
