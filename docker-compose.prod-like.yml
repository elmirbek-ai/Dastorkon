name: dastorkon-prod-like

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-dastorkon}"
      POSTGRES_USER: "${POSTGRES_USER:-dastorkon}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-only-change-me}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.10-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: "${SECRET_KEY:-local-prod-like-only-change-before-real-production}"
      DEBUG: "${DEBUG:-False}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-localhost,127.0.0.1}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://dastorkon:local-only-change-me@db:5432/dastorkon}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      SECURE_PROXY_SSL_HEADER: "${SECURE_PROXY_SSL_HEADER:-False}"
      SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-False}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-False}"
      CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-False}"
      SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-0}"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "${SECURE_HSTS_INCLUDE_SUBDOMAINS:-False}"
      SECURE_HSTS_PRELOAD: "${SECURE_HSTS_PRELOAD:-False}"
      SECURE_CONTENT_TYPE_NOSNIFF: "${SECURE_CONTENT_TYPE_NOSNIFF:-True}"
      SECURE_REFERRER_POLICY: "${SECURE_REFERRER_POLICY:-same-origin}"
      X_FRAME_OPTIONS: "${X_FRAME_OPTIONS:-DENY}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -eu
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        exec daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - staticfiles:/srv/dastorkon/staticfiles:ro
      - media:/srv/dastorkon/media:ro

volumes:
  postgres_data:
  staticfiles:
  media:
